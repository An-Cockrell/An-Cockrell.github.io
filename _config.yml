# site settings
title: UVM An-Cockrell Lab
subtitle: Center for Biomedical Digital Twins
# email: youremailaddress@gmail.com
description: We build mechanism-based digital twins of human disease. By combining agent-based modeling, machine learning and high-performance computing, our work spans detailed models of specific organ systems and disease processes, the fundamental dynamics of complex biomedical systems, and AI methods for discovering how to control them. Our flagship effort is ReSCUED, an ARPA-H-funded program to build digital twins that guide treatment of critically ill patients.
